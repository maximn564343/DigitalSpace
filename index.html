<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Digital space</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#000; overflow:hidden; }
  body { font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
         color:#a8e8c0; cursor:none; }
  #game { display:block; width:100vw; height:100vh; }
  #start {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center,
                 #0a1a12 0%, #030c07 55%, #000 100%);
    transition: opacity 1.4s ease;
  }
  #start.hidden { opacity:0; pointer-events:none; }
  h1 {
    font-size: 68px; font-weight: 200;
    letter-spacing: 14px;
    color:#c6ffd8;
    text-shadow: 0 0 30px #2fbf66, 0 0 80px #0d3f20;
    will-change: transform;
    user-select:none;
  }
  .hint {
    position:absolute; bottom: 64px;
    font-size: 12px; letter-spacing: 5px;
    color:#3d8a5e; text-transform: lowercase;
    opacity: 0.55;
    animation: pulse 3.2s ease-in-out infinite;
    user-select:none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.20; }
    50%      { opacity: 0.75; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="start">
  <h1 id="title">DIGITAL SPACE</h1>
  <div class="hint">нажмите enter чтобы начать игру</div>
</div>

<script>
"use strict";

const cv  = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha:false });

let W, H;

function resize(){
  const aspect = window.innerWidth / window.innerHeight;
  const targetPixels = 480000;
  W = Math.round(Math.sqrt(targetPixels * aspect));
  H = Math.round(Math.sqrt(targetPixels / aspect));
  cv.width  = W;
  cv.height = H;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', resize);
resize();

function hash(x, y, s){
  let h = Math.imul(x|0, 374761393) ^
          Math.imul(y|0, 668265263) ^
          Math.imul(s|0, 2147483647);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = (h ^ (h >>> 16)) >>> 0;
  return h / 4294967296;
}

const BLOCK  = 3;
const CHUNK  = 9;
const DOOR_P = 0.82;

function doorH(bx, by){ return hash(bx, by, 101) < DOOR_P; }
function doorV(bx, by){ return hash(bx, by, 202) < DOOR_P; }

function baseWall(ix, iy){
  const bx = Math.floor(ix / BLOCK), by = Math.floor(iy / BLOCK);
  const lx = ix - bx * BLOCK, ly = iy - by * BLOCK;
  if(lx === 1 && ly === 1) return false;
  if(lx !== 1 && ly !== 1) return true;
  if(ly === 0) return !doorV(bx, by - 1);
  if(ly === 2) return !doorV(bx, by);
  if(lx === 0) return !doorH(bx - 1, by);
  if(lx === 2) return !doorH(bx, by);
  return true;
}

function chunkTheme(cx, cy){
  const r = hash(cx, cy, 9001);
  if(r < 0.30) return 0;
  if(r < 0.50) return 1;
  if(r < 0.70) return 2;
  if(r < 0.88) return 3;
  return 4;
}

const _t = { solid:false, h:0 };

function tileInfo(ix, iy, out){
  if(!baseWall(ix, iy)){ out.solid = false; out.h = 0; return; }

  const cx = Math.floor(ix / CHUNK), cy = Math.floor(iy / CHUNK);
  const theme = chunkTheme(cx, cy);
  const lcx = ix - cx * CHUNK, lcy = iy - cy * CHUNK;
  const interior = lcx > 0 && lcx < CHUNK - 1 && lcy > 0 && lcy < CHUNK - 1;

  if((theme === 1 || theme === 4) && interior){
    out.solid = false; out.h = 0; return;
  }
  if(theme === 2 && interior){
    if(lcx % 3 === 1 && lcy % 3 === 1){ out.solid = true; out.h = 3.2; return; }
    out.solid = false; out.h = 0; return;
  }
  out.solid = true;
  out.h = (theme === 3) ? 4.6 : 2.6;
}

function isWall(ix, iy){ tileInfo(ix, iy, _t); return _t.solid; }

const WALL_COLORS = [
  [22, 74, 42],
  [26, 84, 48],
  [18, 62, 34],
  [24, 80, 46],
  [16, 54, 30]
];

const FOV       = 88 * Math.PI / 180;
const EYE       = 1.0;
const MAX_DIST  = 48;
const PITCH_MAX = 0.42;

let px = 1.5, py = 1.5, pa = 0, pitch = 0;
let bobPhase = 0, bobOffset = 0, breathPhase = 0;

function findSpawn(){
  for(let by = 0; by < 60; by++){
    for(let bx = 0; bx < 60; bx++){
      const open = doorH(bx-1, by) || doorH(bx, by) ||
                   doorV(bx, by-1) || doorV(bx, by);
      if(open) return [bx*BLOCK + 1.5, by*BLOCK + 1.5];
    }
  }
  return [4.5, 4.5];
}
[px, py] = findSpawn();

function hitsWall(x, y, r){
  return isWall(Math.floor(x-r), Math.floor(y-r)) ||
         isWall(Math.floor(x+r), Math.floor(y-r)) ||
         isWall(Math.floor(x-r), Math.floor(y+r)) ||
         isWall(Math.floor(x+r), Math.floor(y+r));
}
function tryMove(dx, dy){
  const r = 0.30;
  if(!hitsWall(px+dx, py, r)) px += dx;
  if(!hitsWall(px, py+dy, r)) py += dy;
}

const dust = [];
for(let i = 0; i < 130; i++){
  dust.push({
    x: Math.random(), y: Math.random(),
    s: 0.18 + Math.random()*0.75,
    a: 0.02 + Math.random()*0.10,
    ph: Math.random()*6.3
  });
}

function render(time){
  const t = time * 0.001;
  const amb = 0.86 + 0.14*Math.sin(t*0.4 + 1.2) + 0.04*Math.sin(t*1.7);
  const horizon = H*0.5 + pitch*H*0.9 + bobOffset;

  ctx.fillStyle = '#030c07';
  ctx.fillRect(0, 0, W, Math.max(0, horizon));

  ctx.fillStyle = '#071710';
  ctx.fillRect(0, Math.max(0, horizon), W, H);

  const dirX = Math.cos(pa), dirY = Math.sin(pa);
  const planeLen = Math.tan(FOV / 2);
  const planeX = -dirY * planeLen;
  const planeY =  dirX * planeLen;

  for(let x = 0; x < W; x++){
    const camX = 2*x/W - 1;
    const rdx = dirX + planeX * camX;
    const rdy = dirY + planeY * camX;

    let mapX = Math.floor(px), mapY = Math.floor(py);
    const ddx = Math.abs(1 / (rdx || 1e-9));
    const ddy = Math.abs(1 / (rdy || 1e-9));

    let stepX, stepY, sdx, sdy;
    if(rdx < 0){ stepX = -1; sdx = (px - mapX) * ddx; }
    else       { stepX =  1; sdx = (mapX + 1 - px) * ddx; }
    if(rdy < 0){ stepY = -1; sdy = (py - mapY) * ddy; }
    else       { stepY =  1; sdy = (mapY + 1 - py) * ddy; }

    let side = 0, perp = 0, hit = null;

    for(let i = 0; i < 160; i++){
      if(sdx < sdy){ sdx += ddx; mapX += stepX; side = 0; }
      else         { sdy += ddy; mapY += stepY; side = 1; }

      tileInfo(mapX, mapY, _t);
      if(_t.solid){
        perp = side === 0
          ? (mapX - px + (1 - stepX) * 0.5) / rdx
          : (mapY - py + (1 - stepY) * 0.5) / rdy;
        hit = { h: _t.h, mx: mapX, my: mapY };
        break;
      }
      if(sdx > MAX_DIST && sdy > MAX_DIST) break;
    }

    if(!hit || perp <= 0.005 || perp > MAX_DIST) continue;

    const hgt = hit.h;
    const cxC = Math.floor(hit.mx / CHUNK);
    const cyC = Math.floor(hit.my / CHUNK);
    const theme = chunkTheme(cxC, cyC);
    const col = WALL_COLORS[theme];

    const scale     = H / perp;
    const fullStart = horizon + (EYE - hgt) * scale;
    const fullEnd   = horizon +  EYE       * scale;

    const y0 = Math.max(0, fullStart);
    const y1 = Math.min(H, fullEnd);
    if(y1 <= y0) continue;

    const bright = Math.min(1, amb * Math.exp(-perp * 0.14) * 1.7);
    const sideMult = side === 1 ? 0.72 : 1.0;
    const m = bright * sideMult;
    const r = (col[0] * m) | 0;
    const g = (col[1] * m) | 0;
    const b = (col[2] * m) | 0;

    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(x, y0, 1, y1 - y0);
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const d of dust){
    d.y += d.s * 0.00055;
    d.x += Math.sin(t*0.4 + d.ph) * 0.00007;
    if(d.y > 1){ d.y = 0; d.x = Math.random(); }
    if(d.x > 1) d.x -= 1;
    if(d.x < 0) d.x += 1;
    ctx.fillStyle = `rgba(120,255,170,${d.a.toFixed(3)})`;
    ctx.fillRect(d.x * W | 0, d.y * H | 0, 1, 1);
  }
  ctx.restore();

  const rg = ctx.createRadialGradient(W*0.5, H*0.55, 20, W*0.5, H*0.55, W*0.72);
  rg.addColorStop(0.0, 'rgba(60,220,120,0.06)');
  rg.addColorStop(0.6, 'rgba(20,120,60,0.025)');
  rg.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  const vg = ctx.createRadialGradient(W*0.5, H*0.5, H*0.35, W*0.5, H*0.5, H*1.05);
  vg.addColorStop(0.0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.7, 'rgba(0,0,0,0.35)');
  vg.addColorStop(1.0, 'rgba(0,0,0,0.92)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(0,40,20,0.055)';
  ctx.fillRect(0, 0, W, H);
}

const keys = Object.create(null);
let gameStarted = false;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))
    e.preventDefault();
  if(e.code === 'Enter' && !gameStarted) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const startEl = document.getElementById('start');

function startGame(){
  if(gameStarted) return;
  gameStarted = true;
  startEl.classList.add('hidden');
  startAudio();
  setTimeout(() => {
    if(cv.requestPointerLock) cv.requestPointerLock();
  }, 60);
}

document.addEventListener('pointerlockchange', () => {
  if(gameStarted && document.pointerLockElement !== cv){
    gameStarted = false;
    startEl.classList.remove('hidden');
  }
});

startEl.addEventListener('click', () => { if(!gameStarted) startGame(); });
cv.addEventListener('click', () => {
  if(gameStarted && document.pointerLockElement !== cv){
    if(cv.requestPointerLock) cv.requestPointerLock();
  }
});

document.addEventListener('mousemove', e => {
  if(document.pointerLockElement !== cv) return;
  pa    += e.movementX * 0.0020;
  pitch -= e.movementY * 0.0015;
  if(pitch >  PITCH_MAX) pitch =  PITCH_MAX;
  if(pitch < -PITCH_MAX) pitch = -PITCH_MAX;
});

let audioCtx = null;
function startAudio(){
  if(audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const out = audioCtx.createGain();
    out.gain.value = 0.032;
    out.connect(audioCtx.destination);

    const o1 = audioCtx.createOscillator();
    o1.type = 'sine';  o1.frequency.value = 47.5;
    o1.connect(out);   o1.start();

    const o2 = audioCtx.createOscillator();
    o2.type = 'sine';  o2.frequency.value = 48.3;
    o2.connect(out);   o2.start();

    const o3 = audioCtx.createOscillator();
    o3.type = 'triangle'; o3.frequency.value = 96;
    const g3 = audioCtx.createGain();
    g3.gain.value = 0.010;
    o3.connect(g3); g3.connect(audioCtx.destination); o3.start();
  } catch(e){}
}

function update(dt){
  const run = !!(keys['ShiftLeft'] || keys['ShiftRight']);
  const speed = (run ? 3.6 : 1.9) * dt;

  let f = 0, s = 0;
  if(keys['KeyW'] || keys['ArrowUp'])    f += 1;
  if(keys['KeyS'] || keys['ArrowDown'])  f -= 1;
  if(keys['KeyA']) s -= 1;
  if(keys['KeyD']) s += 1;

  if(keys['ArrowLeft'])  pa -= 2.0 * dt;
  if(keys['ArrowRight']) pa += 2.0 * dt;

  let moving = false;
  const len = Math.hypot(f, s);
  if(len > 0){
    f /= len; s /= len;
    const c = Math.cos(pa), sn = Math.sin(pa);
    tryMove((c*f - sn*s) * speed, (sn*f + c*s) * speed);
    moving = true;
  }

  if(moving) bobPhase += dt * (run ? 12 : 8);
  else       bobPhase += dt * 1.5;

  breathPhase += dt * 1.2;

  const targetBob = moving ? Math.sin(bobPhase) * 1.8
                           : Math.sin(breathPhase) * 0.35;
  bobOffset += (targetBob - bobOffset) * Math.min(1, dt * 8);
}

let last = performance.now();

function loop(now){
  let dt = (now - last) / 1000;
  if(dt > 0.06) dt = 0.06;
  last = now;

  if(gameStarted){
    update(dt);
    render(now);
  }
  requestAnimationFrame(loop);
}

const titleEl = document.getElementById('title');

function lagTick(){
  const big = Math.random() < 0.40;
  const dx = (Math.random() - 0.5) * (big ? 34 : 11);
  const dy = (Math.random() - 0.5) * (big ? 16 : 6);
  titleEl.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;

  const nextDelay = Math.random() < 0.55
    ? 8  + Math.random() * 22
    : 22 + Math.random() * 55;
  setTimeout(lagTick, nextDelay);
}

lagTick();
requestAnimationFrame(loop);
</script>
</body>
</html>
